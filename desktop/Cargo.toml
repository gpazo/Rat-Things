[package]
name = "rat-things-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
default-run = "rat-things-desktop"

[features]
installed-runtime = []

[[bin]]
name = "rat-things"
path = "src/cli.rs"
required-features = ["installed-runtime"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "glow", "default_fonts", "wayland", "x11"] }
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "=0.26.0", default-features = false, features = ["pulldown_cmark"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
zeroize = "1"
getrandom = "0.4"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "21"

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
