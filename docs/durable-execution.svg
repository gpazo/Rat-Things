<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" role="img"
  aria-labelledby="durable-execution-title durable-execution-desc"
  data-visual-question="What happens during durable Session work?">
  <title id="durable-execution-title">Durable execution sequence</title>
  <desc id="durable-execution-desc">Owned Session input is saved before outbox dispatch. An isolated worker harness executes Turns, journals durable evidence, and delivers saved root Turn outcomes independently.</desc>
  <defs>
    <style>
      .frame { fill: #1c1c1d; stroke: #2e2e31; stroke-width: 1.5; }
      .node { fill: #202022; stroke: #3e3e44; stroke-width: 1.5; }
      .node--run { fill: #252527; stroke: #828fff; stroke-width: 2; }
      .number { fill: #1c1c1d; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .number-ring { fill: #d0d6e0; stroke: #d0d6e0; stroke-width: 2; }
      .label { fill: #f7f8f8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 27px; font-weight: 600; }
      .detail { fill: #8a8f98; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 17px; }
      .evidence { fill: #d0d6e0; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 14px; }
      .flow { fill: none; stroke: #8a8f98; stroke-width: 3; }
      .arrow { fill: #8a8f98; }
      .boundary-label { fill: #828fff; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="758" height="938" rx="24"/>

  <g data-node="primary">
    <circle class="number-ring" cx="92" cy="105" r="25"/>
    <text class="number" x="92" y="106">1</text>
    <rect class="node" x="145" y="42" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="89">Accept Session input</text>
    <text class="detail" x="180" y="121">Authenticate the owner; save input and Turn state first.</text>
    <text class="evidence" x="180" y="146">Agent snapshot · Session input · durable receipt</text>
  </g>

  <line class="flow" x1="92" y1="131" x2="92" y2="234"/>
  <path class="arrow" d="M 83 227 L 92 241 L 101 227 Z"/>

  <g data-node="primary">
    <circle class="number-ring" cx="92" cy="269" r="25"/>
    <text class="number" x="92" y="270">2</text>
    <rect class="node" x="145" y="206" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="253">Dispatch the outbox</text>
    <text class="detail" x="180" y="285">Dispatch saved work; reserve a private harness launch.</text>
    <text class="evidence" x="180" y="310">Session outbox · execution queue · retry fences</text>
  </g>

  <line class="flow" x1="92" y1="295" x2="92" y2="398"/>
  <path class="arrow" d="M 83 391 L 92 405 L 101 391 Z"/>

  <text class="boundary-label" x="145" y="391">Isolated Lambda MicroVM · Session harness</text>
  <g data-node="primary">
    <circle class="number-ring" cx="92" cy="433" r="25"/>
    <text class="number" x="92" y="434">3</text>
    <rect class="node--run" x="145" y="402" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="449">Execute a Turn</text>
    <text class="detail" x="180" y="481">Native Codex runs with declared tools and resolved policy.</text>
    <text class="evidence" x="180" y="506">model · function tools · MCP · environment</text>
  </g>

  <line class="flow" x1="92" y1="459" x2="92" y2="598"/>
  <path class="arrow" d="M 83 591 L 92 605 L 101 591 Z"/>

  <g data-node="primary">
    <circle class="number-ring" cx="92" cy="633" r="25"/>
    <text class="number" x="92" y="634">4</text>
    <rect class="node" x="145" y="570" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="617">Retain</text>
    <text class="detail" x="180" y="649">Journal Items, Turns and checkpoints; save output Artifacts.</text>
    <text class="evidence" x="180" y="674">durability lives outside the worker</text>
  </g>

  <line class="flow" x1="92" y1="659" x2="92" y2="762"/>
  <path class="arrow" d="M 83 755 L 92 769 L 101 755 Z"/>

  <g data-node="primary">
    <circle class="number-ring" cx="92" cy="797" r="25"/>
    <text class="number" x="92" y="798">5</text>
    <rect class="node" x="145" y="734" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="781">Deliver</text>
    <text class="detail" x="180" y="813">Read saved output, deliver a root Turn, or publish Artifacts.</text>
    <text class="evidence" x="180" y="838">SDK Items · provider reply · immutable publication</text>
  </g>

  <text class="detail" x="145" y="906">Compute is disposable. Saved Session work is durable.</text>
</svg>
