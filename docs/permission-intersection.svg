<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img"
  aria-labelledby="permission-intersection-title permission-intersection-desc"
  data-visual-question="How does Rat Things determine effective permission?">
  <title id="permission-intersection-title">Permission intersection</title>
  <desc id="permission-intersection-desc">Effective operations are the intersection of verified provider authorization, the account grant, the deployment capability profile, and Session tool constraints. Any layer can deny access; no layer can widen an earlier one.</desc>
  <defs>
    <style>
      .frame { fill: #1c1c1d; stroke: #2e2e31; stroke-width: 1.5; }
      .node { fill: #202022; stroke: #3e3e44; stroke-width: 1.5; }
      .node--result { fill: #252527; stroke: #828fff; stroke-width: 2; }
      .label { fill: #f7f8f8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 25px; font-weight: 600; text-anchor: middle; }
      .detail { fill: #8a8f98; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; text-anchor: middle; }
      .and-label { fill: #8a8f98; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .equals { fill: #8a8f98; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 30px; font-weight: 600; text-anchor: middle; }
      .result-detail { fill: #d0d6e0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; text-anchor: middle; }
      .rule { fill: #8a8f98; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="758" height="898" rx="24"/>

  <g data-node="primary">
    <rect class="node" x="120" y="42" width="520" height="112" rx="16"/>
    <text class="label" x="380" y="88">Provider authorization</text>
    <text class="detail" x="380" y="121">Verified account access and reported scopes</text>
  </g>
  <text class="and-label" x="380" y="183">AND</text>

  <g data-node="primary">
    <rect class="node" x="120" y="208" width="520" height="112" rx="16"/>
    <text class="label" x="380" y="254">Account grant</text>
    <text class="detail" x="380" y="287">Persistent read-only, read-write, full, or custom ceiling</text>
  </g>
  <text class="and-label" x="380" y="349">AND</text>

  <g data-node="primary">
    <rect class="node" x="120" y="374" width="520" height="112" rx="16"/>
    <text class="label" x="380" y="420">Capability profile</text>
    <text class="detail" x="380" y="453">Deployment-approved sandbox, network, tools, and policy</text>
  </g>
  <text class="and-label" x="380" y="515">AND</text>

  <g data-node="primary">
    <rect class="node" x="120" y="540" width="520" height="112" rx="16"/>
    <text class="label" x="380" y="586">Session tool constraints</text>
    <text class="detail" x="380" y="619">Selected accounts, operation lists, and resources</text>
  </g>

  <text class="equals" x="380" y="701">=</text>

  <g data-node="primary">
    <rect class="node--result" x="90" y="718" width="580" height="120" rx="18"/>
    <text class="label" x="380" y="766">Effective operations</text>
    <text class="result-detail" x="380" y="800">Only what every layer permits; autonomous for this Run</text>
  </g>

  <text class="rule" x="380" y="872">A deny always wins · no layer can widen an earlier layer</text>
</svg>
