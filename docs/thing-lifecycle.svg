<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" role="img"
  aria-labelledby="thing-lifecycle-title thing-lifecycle-desc"
  data-visual-question="How does a Thing move from draft to active use?">
  <title id="thing-lifecycle-title">Thing lifecycle</title>
  <desc id="thing-lifecycle-desc">A Thing moves through five focused steps: create an immutable draft revision, explain its effective authority, test that exact draft, publish it with compare and swap, then run the pinned active revision manually or on a schedule.</desc>
  <defs>
    <style>
      .frame { fill: #071319; stroke: rgba(128, 230, 255, 0.22); stroke-width: 1.5; }
      .rail { fill: none; stroke: #3c6672; stroke-width: 3; }
      .flow { fill: none; stroke: #80e6ff; stroke-width: 3; }
      .arrow { fill: #80e6ff; }
      .node { fill: #102129; stroke: #3c6672; stroke-width: 1.5; }
      .node--active { fill: #2b2418; stroke: #ffb13b; stroke-width: 2; }
      .step { fill: #80e6ff; stroke: #80e6ff; stroke-width: 2; }
      .active-step { fill: #ffb13b; stroke: #ffb13b; stroke-width: 2; }
      .step-number { fill: #071319; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .active-number { fill: #071319; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .label { fill: #edf6f8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 27px; font-weight: 700; }
      .detail { fill: #9db2b8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 17px; }
      .evidence { fill: #bff3ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
      .active-detail { fill: #ffca79; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 17px; }
    </style>
  </defs>

  <rect class="frame" x="1" y="1" width="758" height="938" rx="24"/>
  <path class="rail" d="M 92 110 V 830"/>

  <g data-node="primary">
    <circle class="step" cx="92" cy="110" r="25"/>
    <text class="step-number" x="92" y="111">1</text>
    <rect class="node" x="145" y="47" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="94">Draft revision</text>
    <text class="detail" x="180" y="126">Append immutable history; move only the draft pointer.</text>
    <text class="evidence" x="180" y="151">revision + specHash</text>
  </g>

  <line class="flow" x1="92" y1="136" x2="92" y2="239"/>
  <path class="arrow" d="M 83 232 L 92 246 L 101 232 Z"/>

  <g data-node="primary">
    <circle class="step" cx="92" cy="274" r="25"/>
    <text class="step-number" x="92" y="275">2</text>
    <rect class="node" x="145" y="211" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="258">Explain</text>
    <text class="detail" x="180" y="290">Resolve accounts, permissions, approvals, and diagnostics.</text>
    <text class="evidence" x="180" y="315">GET …/explain?target=draft</text>
  </g>

  <line class="flow" x1="92" y1="300" x2="92" y2="403"/>
  <path class="arrow" d="M 83 396 L 92 410 L 101 396 Z"/>

  <g data-node="primary">
    <circle class="step" cx="92" cy="438" r="25"/>
    <text class="step-number" x="92" y="439">3</text>
    <rect class="node" x="145" y="375" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="422">Test exact draft</text>
    <text class="detail" x="180" y="454">Create a durable run without changing production.</text>
    <text class="evidence" x="180" y="479">testRunId + revision + specHash</text>
  </g>

  <line class="flow" x1="92" y1="464" x2="92" y2="567"/>
  <path class="arrow" d="M 83 560 L 92 574 L 101 560 Z"/>

  <g data-node="primary">
    <circle class="step" cx="92" cy="602" r="25"/>
    <text class="step-number" x="92" y="603">4</text>
    <rect class="node" x="145" y="539" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="586">Publish</text>
    <text class="detail" x="180" y="618">Compare-and-swap the tested draft into the active pointer.</text>
    <text class="evidence" x="180" y="643">testRunId + expected revision + expected specHash</text>
  </g>

  <line class="flow" x1="92" y1="628" x2="92" y2="731"/>
  <path class="arrow" d="M 83 724 L 92 738 L 101 724 Z"/>

  <g data-node="primary">
    <circle class="active-step" cx="92" cy="766" r="25"/>
    <text class="active-number" x="92" y="767">5</text>
    <rect class="node--active" x="145" y="703" width="555" height="126" rx="16"/>
    <text class="label" x="180" y="750">Active revision</text>
    <text class="active-detail" x="180" y="782">Run explicitly or through EventBridge rate/cron.</text>
    <text class="evidence" x="180" y="807">production remains pinned while the next draft changes</text>
  </g>

  <text class="detail" x="145" y="890">Pause disables scheduling. Archive is terminal. Neither rewrites history.</text>
</svg>
