<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="850" viewBox="0 0 2200 850" role="img" aria-labelledby="title description">
  <title id="title">C4 Level 2 Rat Things</title>
  <desc id="description">A container diagram showing signed requests entering API Gateway and Lambda ingress, passing through run control, SQS, a dispatcher, a Lambda MicroVM, durable state and artifacts, event delivery, and result destinations.</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-start" markerWidth="11" markerHeight="11" refX="2" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M11,0 L0,5.5 L11,11 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 500; fill: #17212b; }
      .boundary-label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 1.8px; fill: #2d628f; }
      .kind-light { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 1.2px; fill: #dcecff; }
      .kind-dark { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 1.2px; fill: #66737f; }
      .node-title-light { font-family: Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #ffffff; }
      .node-tech-light { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #ffffff; }
      .node-title-dark { font-family: Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #17212b; }
      .node-tech-dark { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #344250; }
      .flow-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #344250; }
      .line { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .line-both { fill: none; stroke: #52606d; stroke-width: 3; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; opacity: 0.96; }
    </style>
  </defs>

  <rect width="2200" height="850" fill="#ffffff"/>
  <text x="1100" y="55" text-anchor="middle" class="title">C4 · Level 2 — Rat Things</text>

  <rect x="300" y="140" width="1580" height="650" rx="22" fill="#f5f9fd" stroke="#4d7da5" stroke-width="3"/>
  <text x="340" y="180" class="boundary-label">RAT THINGS · SYSTEM BOUNDARY</text>

  <!-- External request sources -->
  <rect x="20" y="280" width="250" height="160" rx="14" fill="#e8edf2" stroke="#7a8793" stroke-width="2.5"/>
  <text x="145" y="320" text-anchor="middle" class="kind-dark">EXTERNAL SYSTEMS</text>
  <text x="145" y="360" text-anchor="middle" class="node-title-dark">Webhook / API</text>
  <text x="145" y="390" text-anchor="middle" class="node-tech-dark">GitHub · GitLab · Teams · CLI</text>

  <!-- Primary containers -->
  <g>
    <rect x="340" y="280" width="220" height="160" rx="14" fill="#1268b3" stroke="#0b4f8a" stroke-width="3"/>
    <text x="450" y="315" text-anchor="middle" class="kind-light">CONTAINER</text>
    <text x="450" y="355" text-anchor="middle" class="node-title-light">Ingress</text>
    <text x="450" y="388" text-anchor="middle" class="node-tech-light">API Gateway + Lambda</text>
  </g>

  <g>
    <rect x="620" y="280" width="220" height="160" rx="14" fill="#1268b3" stroke="#0b4f8a" stroke-width="3"/>
    <text x="730" y="315" text-anchor="middle" class="kind-light">CONTAINER</text>
    <text x="730" y="355" text-anchor="middle" class="node-title-light">Run Control</text>
    <text x="730" y="388" text-anchor="middle" class="node-tech-light">Lambda</text>
  </g>

  <g>
    <rect x="900" y="280" width="220" height="160" rx="14" fill="#dcecf8" stroke="#4d7da5" stroke-width="2.5"/>
    <text x="1010" y="315" text-anchor="middle" class="kind-dark">DATA CONTAINER</text>
    <text x="1010" y="355" text-anchor="middle" class="node-title-dark">Run Queue</text>
    <text x="1010" y="388" text-anchor="middle" class="node-tech-dark">Amazon SQS</text>
  </g>

  <g>
    <rect x="1180" y="280" width="220" height="160" rx="14" fill="#1268b3" stroke="#0b4f8a" stroke-width="3"/>
    <text x="1290" y="315" text-anchor="middle" class="kind-light">CONTAINER</text>
    <text x="1290" y="355" text-anchor="middle" class="node-title-light">Dispatcher</text>
    <text x="1290" y="388" text-anchor="middle" class="node-tech-light">Lambda</text>
  </g>

  <g>
    <rect x="1460" y="280" width="360" height="160" rx="14" fill="#1268b3" stroke="#0b4f8a" stroke-width="3"/>
    <text x="1640" y="315" text-anchor="middle" class="kind-light">CONTAINER</text>
    <text x="1640" y="355" text-anchor="middle" class="node-title-light">Isolated Runner</text>
    <text x="1640" y="388" text-anchor="middle" class="node-tech-light">AWS Lambda MicroVM</text>
  </g>

  <!-- Durable output path -->
  <g>
    <rect x="620" y="570" width="330" height="160" rx="14" fill="#dcecf8" stroke="#4d7da5" stroke-width="2.5"/>
    <text x="785" y="605" text-anchor="middle" class="kind-dark">DATA CONTAINER</text>
    <text x="785" y="645" text-anchor="middle" class="node-title-dark">State &amp; Artifacts</text>
    <text x="785" y="678" text-anchor="middle" class="node-tech-dark">DynamoDB + S3</text>
  </g>

  <g>
    <rect x="1100" y="570" width="340" height="160" rx="14" fill="#1268b3" stroke="#0b4f8a" stroke-width="3"/>
    <text x="1270" y="605" text-anchor="middle" class="kind-light">CONTAINER GROUP</text>
    <text x="1270" y="645" text-anchor="middle" class="node-title-light">Event Delivery</text>
    <text x="1270" y="678" text-anchor="middle" class="node-tech-light">Streams · EventBridge · Lambda</text>
  </g>

  <!-- External result destination -->
  <rect x="1930" y="570" width="250" height="160" rx="14" fill="#e8edf2" stroke="#7a8793" stroke-width="2.5"/>
  <text x="2055" y="605" text-anchor="middle" class="kind-dark">EXTERNAL SYSTEMS</text>
  <text x="2055" y="645" text-anchor="middle" class="node-title-dark">Result Destinations</text>
  <text x="2055" y="678" text-anchor="middle" class="node-tech-dark">Thread · chat · API</text>

  <!-- External model -->
  <rect x="1500" y="10" width="280" height="115" rx="14" fill="#e8edf2" stroke="#7a8793" stroke-width="2.5"/>
  <text x="1640" y="39" text-anchor="middle" class="kind-dark">EXTERNAL SYSTEM</text>
  <text x="1640" y="76" text-anchor="middle" class="node-title-dark">Model Provider</text>
  <text x="1640" y="104" text-anchor="middle" class="node-tech-dark">Bedrock or configured provider</text>

  <!-- Primary request flow -->
  <rect x="270" y="359" width="70" height="3" fill="#52606d"/>
  <polygon points="340,360 329,354 329,366" fill="#52606d"/>
  <rect x="560" y="359" width="60" height="3" fill="#52606d"/>
  <polygon points="620,360 609,354 609,366" fill="#52606d"/>
  <rect x="840" y="359" width="60" height="3" fill="#52606d"/>
  <polygon points="900,360 889,354 889,366" fill="#52606d"/>
  <rect x="1120" y="359" width="60" height="3" fill="#52606d"/>
  <polygon points="1180,360 1169,354 1169,366" fill="#52606d"/>
  <rect x="1400" y="359" width="60" height="3" fill="#52606d"/>
  <polygon points="1460,360 1449,354 1449,366" fill="#52606d"/>

  <!-- Store and result flow -->
  <rect x="729" y="440" width="3" height="130" fill="#52606d"/>
  <polygon points="730,570 724,559 736,559" fill="#52606d"/>
  <rect x="1509" y="440" width="3" height="82" fill="#52606d"/>
  <rect x="950" y="519" width="562" height="3" fill="#52606d"/>
  <rect x="949" y="520" width="3" height="50" fill="#52606d"/>
  <polygon points="950,570 944,559 956,559" fill="#52606d"/>
  <rect x="950" y="649" width="150" height="3" fill="#52606d"/>
  <polygon points="1100,650 1089,644 1089,656" fill="#52606d"/>
  <rect x="1440" y="649" width="490" height="3" fill="#52606d"/>
  <polygon points="1930,650 1919,644 1919,656" fill="#52606d"/>
  <rect x="1639" y="125" width="3" height="155" fill="#52606d"/>
  <polygon points="1640,125 1634,136 1646,136" fill="#52606d"/>
  <polygon points="1640,280 1634,269 1646,269" fill="#52606d"/>

  <!-- Flow labels -->
  <g><rect x="278" y="327" width="56" height="26" rx="4" class="label-bg"/><text x="306" y="346" text-anchor="middle" class="flow-label">1 · In</text></g>
  <g><rect x="562" y="327" width="58" height="26" rx="4" class="label-bg"/><text x="591" y="346" text-anchor="middle" class="flow-label">2 · Run</text></g>
  <g><rect x="840" y="327" width="68" height="26" rx="4" class="label-bg"/><text x="874" y="346" text-anchor="middle" class="flow-label">3 · Queue</text></g>
  <g><rect x="1122" y="327" width="58" height="26" rx="4" class="label-bg"/><text x="1151" y="346" text-anchor="middle" class="flow-label">Wake</text></g>
  <g><rect x="1398" y="327" width="65" height="26" rx="4" class="label-bg"/><text x="1430" y="346" text-anchor="middle" class="flow-label">4 · Start</text></g>
  <g><rect x="675" y="486" width="110" height="26" rx="4" class="label-bg"/><text x="730" y="505" text-anchor="middle" class="flow-label">Persist input</text></g>
  <g><rect x="1160" y="487" width="190" height="26" rx="4" class="label-bg"/><text x="1255" y="506" text-anchor="middle" class="flow-label">5 · Output + status</text></g>
  <g><rect x="954" y="617" width="142" height="26" rx="4" class="label-bg"/><text x="1025" y="636" text-anchor="middle" class="flow-label">6 · State change</text></g>
  <g><rect x="1614" y="617" width="94" height="26" rx="4" class="label-bg"/><text x="1661" y="636" text-anchor="middle" class="flow-label">7 · Result</text></g>
  <g><rect x="1557" y="194" width="166" height="26" rx="4" class="label-bg"/><text x="1640" y="213" text-anchor="middle" class="flow-label">Prompt / response</text></g>
</svg>
