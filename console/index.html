<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light"><meta name="theme-color" content="#101511">
  <title>Rat Things Console</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="shell">
    <aside aria-label="Resources">
      <a class="brand" href="/">R<span>Rat Things<small>Agents API</small></span></a>
      <nav id="navigation" aria-label="Resources">
        <button data-view="sessions" aria-current="page">Sessions</button>
        <button data-view="agents">Agents</button>
        <button data-view="templates">Environment templates</button>
        <button data-view="vaults">Vaults</button>
      </nav>
      <div class="list-heading"><span id="list-title">Sessions</span><button id="refresh" aria-label="Refresh resources">↻</button></div>
      <div id="resources" class="resources"></div>
      <button id="more" hidden>Load more</button>
      <button id="new-resource" class="primary">New session</button>
      <footer>Infrastructure and state in your AWS account</footer>
    </aside>
    <main id="main" tabindex="-1">
      <header><div><p class="eyebrow" id="resource-kind">Workspace</p><h1 id="title">Start a session</h1></div><div class="header-actions"><span id="status" role="status"></span><button id="delete" hidden>Delete</button></div></header>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="welcome" class="welcome"><h2>Durable work, one session at a time.</h2><p>Create a reusable agent, start a session, and follow its turns and saved output.</p><button id="welcome-create" class="primary">New session</button></section>
      <section id="session" hidden>
        <div id="environment" class="environment" hidden></div>
        <div id="transcript" class="transcript" aria-label="Session items" aria-live="polite"></div>
        <div id="required-actions"></div>
        <div id="artifacts" class="artifacts"></div>
        <form id="composer" class="composer"><label for="message">Continue this session</label><textarea id="message" rows="3" placeholder="Send a message or steer work in progress" required></textarea><div><span id="turn-status"></span><button id="cancel" type="button" hidden>Cancel turn</button><button class="primary" type="submit">Send</button></div></form>
      </section>
      <section id="details" hidden><pre id="resource-json"></pre><div class="detail-actions"><button id="edit">Edit configuration</button><button id="start-session" class="primary" hidden>Start session</button><button id="add-credential" hidden>Add credential</button></div><div id="credentials"></div></section>
    </main>
  </div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title">New session</h2><button id="close-editor" type="button" aria-label="Close editor">×</button></div><p id="editor-description"></p><label for="configuration">Request JSON</label><textarea id="configuration" rows="17" spellcheck="false" required></textarea><p id="editor-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button id="submit-editor" class="primary" type="submit">Create</button></div></form></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
