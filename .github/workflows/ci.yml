name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.RAT_NATIVE_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reserve native build space
        run: |
          # These preinstalled SDKs are unused by this job. All Rust build tools
          # come from the pinned container, and Node/Terraform are installed below.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          available=$(df -Pk . | awk 'NR == 2 {print $4}')
          if [ "$available" -lt 20971520 ]; then
            echo "Native builds need 20 GiB free. Set RAT_NATIVE_RUNNER to an ARM64 runner with more disk."
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.6
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: codex-runtime
        with:
          path: .runtime/codex/linux-arm64
          key: codex-linux-arm64-${{ hashFiles('runtime/codex/**', '!runtime/codex/model-capabilities.json', '!runtime/codex/README.md', 'scripts/build-codex-runtime.mjs', 'scripts/codex-runtime-targets.mjs') }}
      - name: Build pinned Linux ARM64 runtime
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        run: docker buildx build --platform linux/arm64 --file runtime/codex/Dockerfile --output type=local,dest=.runtime/codex/linux-arm64 .
      # Cache a completed compilation even if a later acceptance check fails.
      # Restoring this cache never skips package, checksum or native image tests.
      - uses: actions/cache/save@v4
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        with:
          path: .runtime/codex/linux-arm64
          key: ${{ steps.codex-runtime.outputs.cache-primary-key }}
      - run: npm run check
      - run: npm run test:infra
      - name: Verify durable storage with LocalStack
        run: npm run test:e2e:localstack
      - run: npm run test:e2e:relay-image
      - run: npm run test:e2e:microvm-image
      - run: npm run test:e2e:native-image
      - name: Archive verified Linux ARM64 runtime
        run: tar -C .runtime/codex/linux-arm64 -czf .runtime/codex/linux-arm64.tar.gz artifact.json runtime
      - name: Export verified Linux ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-arm64-${{ github.sha }}
          path: .runtime/codex/linux-arm64.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-browser-results
          path: test-results/site

  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify x86 sandbox enforcement with the pinned upstream runtime
        run: npx vitest run tests/pi/managed-effects.test.ts tests/runner/managed-sandbox.test.ts tests/simulation/linux-kvm-helper.test.ts tests/simulation/native-vm-prototype.test.ts --no-file-parallelism
      - name: Reserve native build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          available=$(df -Pk . | awk 'NR == 2 {print $4}')
          test "$available" -ge 20971520
      - uses: actions/cache/restore@v4
        id: codex-runtime
        with:
          path: .runtime/codex/linux-x64
          key: codex-linux-x64-${{ hashFiles('runtime/codex/**', '!runtime/codex/model-capabilities.json', '!runtime/codex/README.md', 'scripts/build-codex-runtime.mjs', 'scripts/codex-runtime-targets.mjs') }}
      - name: Build pinned Linux x64 runtime
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        run: docker buildx build --platform linux/amd64 --file runtime/codex/Dockerfile --output type=local,dest=.runtime/codex/linux-x64 .
      - uses: actions/cache/save@v4
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        with:
          path: .runtime/codex/linux-x64
          key: ${{ steps.codex-runtime.outputs.cache-primary-key }}
      - name: Validate x64 artifact provenance
        run: node --input-type=module -e "import { validateCodexRuntimeArtifact } from './scripts/codex-runtime-artifact.mjs'; await validateCodexRuntimeArtifact('.runtime/codex/linux-x64', { expectedTarget:'x86_64-unknown-linux-gnu' });"
      - name: Verify patched x86 sandbox and local Pi transport
        env:
          CODEX_CONFORMANCE_BINARY: ${{ github.workspace }}/.runtime/codex/linux-x64/runtime/bin/codex
          CODEX_REQUIRE_PARITY: 'true'
        run: npx vitest run tests/pi/managed-effects.test.ts tests/pi/managed-subprocess.test.ts tests/runner/managed-sandbox.test.ts tests/agents/local-pi-transport.test.ts tests/agents/local-pi.test.ts --no-file-parallelism
      - name: Archive verified Linux x64 runtime
        run: tar -C .runtime/codex/linux-x64 -czf .runtime/codex/linux-x64.tar.gz artifact.json runtime
      - name: Export verified Linux x64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-x64-${{ github.sha }}
          path: .runtime/codex/linux-x64.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.95.0
      - run: npm ci
      - run: npm run console:check
      - run: npx playwright install chromium
      - run: npm run test:e2e:browser
      - run: npm run console:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-console-results
          path: test-results/native-console
