name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.RAT_NATIVE_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.6
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: codex-runtime
        with:
          path: .runtime/codex/linux-arm64
          key: official-codex-linux-arm64-${{ hashFiles('runtime/codex/source.json', 'runtime/codex/companion-packages.json', 'package-lock.json', 'scripts/build-codex-runtime.mjs', 'scripts/codex-runtime-artifact.mjs', 'scripts/codex-runtime-targets.mjs') }}
      - name: Package official Linux ARM64 runtime
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        run: node scripts/build-codex-runtime.mjs .runtime/codex/linux-arm64
      - uses: actions/cache/save@v4
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        with:
          path: .runtime/codex/linux-arm64
          key: ${{ steps.codex-runtime.outputs.cache-primary-key }}
      - run: npm run check
      - run: npm run test:infra
      - name: Verify durable storage with LocalStack
        run: npm run test:e2e:localstack
      - run: npm run test:e2e:relay-image
      - run: npm run test:e2e:microvm-image
      - run: npm run test:e2e:native-image
      - name: Archive verified Linux ARM64 runtime
        run: tar -C .runtime/codex/linux-arm64 -czf .runtime/codex/linux-arm64.tar.gz artifact.json runtime
      - name: Export verified Linux ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-arm64-${{ github.sha }}
          path: .runtime/codex/linux-arm64.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-browser-results
          path: test-results/site

  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify x86 sandbox enforcement with the pinned upstream runtime
        run: npx vitest run tests/pi/managed-effects.test.ts tests/runner/managed-sandbox.test.ts tests/simulation/linux-kvm-helper.test.ts tests/simulation/native-vm-prototype.test.ts --no-file-parallelism
      - uses: actions/cache/restore@v4
        id: codex-runtime
        with:
          path: .runtime/codex/linux-x64
          key: official-codex-linux-x64-${{ hashFiles('runtime/codex/source.json', 'runtime/codex/companion-packages.json', 'package-lock.json', 'scripts/build-codex-runtime.mjs', 'scripts/codex-runtime-artifact.mjs', 'scripts/codex-runtime-targets.mjs') }}
      - name: Package official Linux x64 runtime
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        run: node scripts/build-codex-runtime.mjs .runtime/codex/linux-x64
      - uses: actions/cache/save@v4
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        with:
          path: .runtime/codex/linux-x64
          key: ${{ steps.codex-runtime.outputs.cache-primary-key }}
      - name: Validate x64 artifact provenance
        run: node --input-type=module -e "import { validateCodexRuntimeArtifact } from './scripts/codex-runtime-artifact.mjs'; await validateCodexRuntimeArtifact('.runtime/codex/linux-x64', { expectedTarget:'x86_64-unknown-linux-musl' });"
      - name: Verify x64 native contracts, checkpoints and Pi sandbox
        env:
          CODEX_CONFORMANCE_BINARY: ${{ github.workspace }}/.runtime/codex/linux-x64/runtime/bin/codex
          CODEX_REQUIRE_PARITY: 'true'
        run: |
          npm run test:agents:parity:host
          npx vitest run tests/runner/managed-sandbox.test.ts --no-file-parallelism
      - name: Verify x64 isolated cold recovery
        env:
          CODEX_RUNTIME_ARTIFACT: ${{ github.workspace }}/.runtime/codex/linux-x64
        run: |
          npm run runtime:local:build
          docker buildx build --platform linux/amd64 --load --file testing/native-parity.Dockerfile --build-arg WORKER_IMAGE=rat-things-local:1 --tag rat-things-native-parity:x64 .
          docker run --rm --platform linux/amd64 --privileged --init --user 0 --env CODEX_COLD_NATIVE_E2E=true --entrypoint npx rat-things-native-parity:x64 --no-install vitest run tests/runner/codex-cold-verification.test.ts --no-file-parallelism
      - name: Archive verified Linux x64 runtime
        run: tar -C .runtime/codex/linux-x64 -czf .runtime/codex/linux-x64.tar.gz artifact.json runtime
      - name: Export verified Linux x64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-x64-${{ github.sha }}
          path: .runtime/codex/linux-x64.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  desktop:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.95.0
      - run: npm ci
      - run: npm run console:check
      - run: npx playwright install chromium
      - run: npm run test:e2e:browser
      - run: npm run console:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-console-results
          path: test-results/native-console
