name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.RAT_NATIVE_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reserve native build space
        run: |
          # These preinstalled SDKs are unused by this job. All Rust build tools
          # come from the pinned container, and Node/Terraform are installed below.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          available=$(df -Pk . | awk 'NR == 2 {print $4}')
          if [ "$available" -lt 20971520 ]; then
            echo "Native builds need 20 GiB free. Set RAT_NATIVE_RUNNER to an ARM64 runner with more disk."
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: codex-runtime
        with:
          path: .runtime/codex/linux-arm64
          key: codex-linux-arm64-${{ hashFiles('runtime/codex/**', '!runtime/codex/model-capabilities.json', 'scripts/build-codex-runtime.mjs') }}
      - name: Build pinned Linux ARM64 runtime
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        run: docker buildx build --platform linux/arm64 --file runtime/codex/Dockerfile --output type=local,dest=.runtime/codex/linux-arm64 .
      # Cache a completed compilation even if a later acceptance check fails.
      # Restoring this cache never skips package, checksum or native image tests.
      - uses: actions/cache/save@v4
        if: steps.codex-runtime.outputs.cache-hit != 'true'
        with:
          path: .runtime/codex/linux-arm64
          key: ${{ steps.codex-runtime.outputs.cache-primary-key }}
      - run: npm run check
      - run: npm run test:infra
      - run: npm run test:e2e:relay-image
      - run: npm run test:e2e:microvm-image
      - run: npm run test:e2e:native-image
      - name: Archive verified Linux ARM64 runtime
        run: tar -C .runtime/codex/linux-arm64 -czf .runtime/codex/linux-arm64.tar.gz artifact.json runtime
      - name: Export verified Linux ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-arm64-${{ github.sha }}
          path: .runtime/codex/linux-arm64.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-browser-results
          path: test-results/site
